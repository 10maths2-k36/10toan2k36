<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu ứng chữ viền tự chạy</title>
    <style>
        body {
            background-color: #0f172a; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .svg-text {
            width: 100%;
            max-width: 600px;
            height: 150px;
        }
        .text-path {
            font-size: 65px;
            font-weight: 900;
            text-anchor: middle;
            fill: none; 
            stroke: #38bdf8; 
            stroke-width: 2px; 
            stroke-dasharray: 500; 
            stroke-dashoffset: 500; 
            animation: drawText 3.5s ease-in-out forwards infinite alternate; 
        }
        @keyframes drawText {
            0% {
                stroke-dashoffset: 500;
                fill: transparent;
            }
            50% {
                stroke-dashoffset: 0; 
                fill: transparent;
            }
            100% {
                stroke-dashoffset: 0;
                fill: #38bdf8; 
            }
        }
    </style>
</head>
<body>
    <svg class="svg-text" viewBox="0 0 600 150">
        <text x="50%" y="50%" dy=".35em" class="text-path">
            CHÀO MỪNG BẠN
        </text>
    </svg>
</body>
</html>
